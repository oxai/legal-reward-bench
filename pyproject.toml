[project]
name = "legal_reward_modeling"
version = "0.1.0"
description = "Pipeline for legal reward-modeling data construction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==0.34.2",
    "datasets==4.8.5",
    "litellm==1.82.6",
    "numpy==1.26.4",
    "peft==0.12.0",
    "python-dotenv==1.2.2",
    "pytest==8.3.5",
    "rank-bm25==0.2.2",
    "rich==13.9.4",
    "torch==2.4.1",
    "transformers==4.45.2",
    "trl==0.11.4",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py311"
