[project]
name = "legal_reward_modeling"
version = "0.1.0"
description = "Pipeline for legal reward-modeling data construction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.30.0",
    "datasets==4.8.5",
    "litellm==1.83.14",
    "numpy==2.4.4",
    "peft>=0.10.0",
    "python-dotenv==1.2.2",
    "rank-bm25==0.2.2",
    "torch==2.11.0",
    "transformers==5.8.0",
    "trl>=0.9.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py311"
